<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax dashboard</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #0c101c;
        color: #f4f7fb;
      }
      main {
        width: min(520px, calc(100% - 32px));
        padding: 28px;
        border-radius: 20px;
        background: #141a2a;
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: #9aa7b8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dashboard</h1>
      <p>Statistics will land here. For now this is a placeholder opened from the extension popup.</p>
    </main>
  </body>
</html>
