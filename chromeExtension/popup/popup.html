<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <header class="brand">
        <img class="logo" src="../icons/icon48.png" alt="" />
        <div>
          <h1>Parallax</h1>
          <p>Local negative-content filter</p>
        </div>
      </header>

      <p id="llm-status" class="status">Checking Parallax API…</p>
      <p id="fb-status" class="status">Checking Facebook tab…</p>
      <p id="dashboard-status" class="status">Checking dashboard…</p>

      <label class="field">
        API URL
        <input id="api-url" type="url" placeholder="http://192.168.0.12:8000" />
      </label>
      <button id="connect-btn" type="button" class="secondary">Save & connect</button>
      <button id="dashboard-btn" type="button">Show dashboard</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
